name: Plugin CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run release:pack -- --out "${{ runner.temp }}/plugin-pack"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: ${{ runner.temp }}/plugin-pack
